        type: string
      armbian_files:
        description: "Bundled system overlay directory"
        required: false
        default: "agenticos-files"
        type: string

env:
  TZ: Etc/UTC

jobs:
  build:
    runs-on: ubuntu-24.04
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(cat compile-kernel/tools/script/ubuntu2404-build-armbian-depends)
          sudo systemctl daemon-reload
          #sudo apt-get -y full-upgrade
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo timedatectl set-ntp true
          date -u
          timedatectl status || true
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          # Get available space in exact GB
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }

          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          echo "Using /: ${root_size}G"

          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Set Armbian download source
        id: down
        working-directory: /builder
        run: |
          # Resolve the Armbian image download URL
          armbian_url="${{ inputs.armbian_url }}"
          if  [[ -z "${armbian_url}" ]]; then
              armbian_site="https://armbian.tnahosting.net/dl/odroidn2/archive/"
              armbian_name="Armbian[^\"<> ]*trixie[^\"<> ]*minimal.img.xz"
              armbian_file=$(curl -s "${armbian_site}" | grep -oE "${armbian_name}" | head -n 1)
              if [[ -n "${armbian_file}" ]]; then
                  armbian_url="${armbian_site}${armbian_file}"
              else
                  echo -e "Error: No valid Armbian image found at: [ ${armbian_site} ]"
                  exit 1
              fi
          fi
          echo "ARMBIAN_URL=${armbian_url}" >> ${GITHUB_ENV}

          # Detect the OS release name from the URL
          set_release=""
          ARR_RELEASE=("resolute" "noble" "trixie" "bookworm")
          i=1
          for r in ${ARR_RELEASE[*]}; do
              if [[ "${armbian_url}" == *"${r}"* ]]; then
                  set_release="_${r}"
                  break
              fi
              let i++
          done

          mkdir -p /builder/build
          ln -sf /builder/build ${{ github.workspace }}/build

          sudo timedatectl set-timezone "${TZ}"
          echo "build_tag=Agenticos${set_release}_s905x_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Validate Agenticos build inputs and model URL
        env:
          BOARD: ${{ inputs.armbian_board || 's905x' }}
          OVERLAY: ${{ inputs.armbian_files || 'agenticos-files' }}
        run: |
          set -euo pipefail
          [[ "$BOARD" == s905x && "$OVERLAY" == agenticos-files ]]
          [[ "$ARMBIAN_URL" == *trixie* || "$ARMBIAN_URL" == *noble* || "$ARMBIAN_URL" == *resolute* ]]
          . agenticos-files/etc/agenticos/agenticos.conf
          status=$(curl -sSIL --retry 2 --max-time 120 -o /tmp/model-headers -w '%{http_code}' "$AGENTICOS_MODEL_URL")
          [[ "$status" == 200 ]] || { echo "Model URL returned $status"; exit 1; }

      - name: Perbaiki permission & symlink overlay
        run: |
          chmod 755 agenticos-files/usr/local/bin/agenticos agenticos-files/usr/local/bin/agenticos-firstboot
          W=agenticos-files/etc/systemd/system/multi-user.target.wants
          mkdir -p "$W"
          ln -sf /etc/systemd/system/agenticos-firstboot.service "$W/agenticos-firstboot.service"
          ln -sf /etc/systemd/system/llama-server.service "$W/llama-server.service"

      - name: Cross-compile llama-server untuk Cortex-A53
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          # Pin to the llama.cpp revision used by the verified working Agenticos Build #9.
          LLAMA_CPP_REV=a91eab67d8389d979d29fdf6633b2edd0718eb4b
          git init /tmp/llama.cpp
          git -C /tmp/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp
          git -C /tmp/llama.cpp fetch --depth 1 origin "$LLAMA_CPP_REV"
          git -C /tmp/llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C /tmp/llama.cpp rev-parse HEAD)" = "$LLAMA_CPP_REV"
          git -C /tmp/llama.cpp rev-parse HEAD | tee /tmp/llama-source.txt
          echo "LLAMA_CPP_COMMIT=$(cat /tmp/llama-source.txt)" >> "$GITHUB_ENV"
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_C_FLAGS="-mcpu=cortex-a53" -DCMAKE_CXX_FLAGS="-mcpu=cortex-a53" \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF
          cmake --build /tmp/llama.cpp/build --target llama-server -j"$(nproc)"
          install -D -m 755 /tmp/llama.cpp/build/bin/llama-server agenticos-files/usr/local/bin/llama-server
          file agenticos-files/usr/local/bin/llama-server
          aarch64-linux-gnu-readelf -d agenticos-files/usr/local/bin/llama-server
          echo "llama.cpp source: $(cat /tmp/llama-source.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Unduh model ke overlay
        run: |
          . agenticos-files/etc/agenticos/agenticos.conf
          mkdir -p agenticos-files/var/lib/agenticos/models
          curl -fL --retry 5 -o agenticos-files/var/lib/agenticos/models/model.gguf "$AGENTICOS_MODEL_URL"
          test "$(head -c 4 agenticos-files/var/lib/agenticos/models/model.gguf)" = GGUF
          ls -lh agenticos-files/var/lib/agenticos/models/model.gguf

      - name: Stage bundled overlay from repository root
        run: |
          set -euo pipefail
          destination="$GITHUB_WORKSPACE/build-armbian/armbian-files/common-files"
          test -d "$destination"
          cp -a agenticos-files/. "$destination/"
          cmp agenticos-files/usr/local/bin/llama-server "$destination/usr/local/bin/llama-server"
          cmp agenticos-files/var/lib/agenticos/models/model.gguf "$destination/var/lib/agenticos/models/model.gguf"

      - name: Rebuild Armbian for target boards
        uses: ./
        if: ${{ env.ARMBIAN_URL != '' && !cancelled() }}
        with:
          build_target: armbian
          armbian_path: ${{ env.ARMBIAN_URL }}
          armbian_board: ${{ inputs.armbian_board || 's905x' }}
          armbian_kernel: ${{ inputs.armbian_kernel || '6.12.y_6.18.y' }}
          auto_kernel: ${{ github.event_name == 'push' && 'true' || format('{0}', inputs.auto_kernel) }}
          kernel_repo: ${{ inputs.kernel_repo || 'ophub/kernel' }}
          kernel_usage: ${{ inputs.kernel_usage || 'stable' }}
          armbian_fstype: ${{ inputs.armbian_fstype || 'ext4' }}
          builder_name: ${{ inputs.builder_name || 'Agenticos' }}
          armbian_size: ${{ inputs.armbian_size || '512/4096' }}
          armbian_files: "false"

      - name: Verify bundled components inside every output image
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        run: |
          set -euo pipefail
          sudo apt-get install -y qemu-user-static
          mountpoint=$(mktemp -d)
          loop=""
          cleanup() {
            sudo umount "$mountpoint" 2>/dev/null || true
            [[ -z "$loop" ]] || sudo losetup -d "$loop"
            rm -f /builder/agenticos-verify.img
            rmdir "$mountpoint"
          }
          trap cleanup EXIT
          shopt -s nullglob
          images=("${PACKAGED_OUTPUTPATH}"/*s905x*.img.gz)
          ((${#images[@]} > 0))
          for image in "${images[@]}"; do
            gzip -dc "$image" > /builder/agenticos-verify.img
            loop=$(sudo losetup --find --show --partscan /builder/agenticos-verify.img)
            sudo mount -o ro "${loop}p2" "$mountpoint"
            sudo cmp agenticos-files/usr/local/bin/llama-server "$mountpoint/usr/local/bin/llama-server"
            sudo cmp agenticos-files/var/lib/agenticos/models/model.gguf "$mountpoint/var/lib/agenticos/models/model.gguf"
            sudo cmp agenticos-files/etc/agenticos/agenticos.conf "$mountpoint/etc/agenticos/agenticos.conf"
            sudo test -x "$mountpoint/usr/local/bin/agenticos"
            sudo test -x "$mountpoint/usr/local/bin/agenticos-firstboot"
            sudo test -x "$mountpoint/usr/bin/python3"
            for service in agenticos-firstboot llama-server; do
              [[ $(sudo readlink "$mountpoint/etc/systemd/system/multi-user.target.wants/$service.service") == "/etc/systemd/system/$service.service" ]]
              sudo test -f "$mountpoint/etc/systemd/system/$service.service"
            done
            sudo qemu-aarch64-static -cpu cortex-a53 -L "$mountpoint" "$mountpoint/usr/local/bin/llama-server" --version
            echo "Verified bundled runtime and model: $(basename "$image")" >> "$GITHUB_STEP_SUMMARY"
            sudo umount "$mountpoint"
            sudo losetup -d "$loop"
            loop=""
            rm /builder/agenticos-verify.img
          done

      - name: Verify release image size
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        run: |
          shopt -s nullglob
          images=("${PACKAGED_OUTPUTPATH}"/*s905x*.img.gz)
          ((${#images[@]} > 0)) || { echo "No s905x image produced"; exit 1; }
          for image in "${images[@]}"; do
            bytes=$(stat -c %s "$image")
            echo "$(basename "$image"): $bytes bytes" | tee -a "$GITHUB_STEP_SUMMARY"
            ((bytes < 1900000000)) || { echo "Image approaches GitHub's 2 GB limit; use the verified 0.5B model and rebuild."; exit 1; }
          done

      - name: Upload Armbian images to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: ${{ env.build_tag }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*s905x*.img.gz
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### Agenticos HG680P Image Information
            - Default username: `root`
            - Default password: `1234`
            - Install command: `armbian-install`
            - Update command: `armbian-update`
            ### Applicable Platform
            - 🐧 `arm64`
            - 🐋 Docker image: https://hub.docker.com/u/ophub
